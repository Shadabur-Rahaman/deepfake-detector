<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deepfake Detection System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        .upload-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .upload-area {
            border: 3px dashed #ddd;
            border-radius: 15px;
            padding: 60px 20px;
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            border-color: #667eea;
            background-color: #f8f9ff;
        }

        .upload-area.dragover {
            border-color: #667eea;
            background-color: #f0f4ff;
        }

        .upload-icon {
            font-size: 4em;
            color: #ddd;
            margin-bottom: 20px;
        }

        .upload-text {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 10px;
        }

        .upload-subtext {
            color: #999;
            font-size: 0.9em;
        }

        #videoUpload {
            display: none;
        }

        .upload-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .upload-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .result-section {
            text-align: center;
        }

        .processing-state {
            margin-bottom: 30px;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .processing-text {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 10px;
        }

        .processing-detail {
            color: #999;
            font-size: 0.9em;
        }

        .completed-state {
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .result-real {
            background-color: #e8f5e8;
            border: 2px solid #4caf50;
        }

        .result-fake {
            background-color: #ffe8e8;
            border: 2px solid #f44336;
        }

        .result-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .result-real .result-icon {
            color: #4caf50;
        }

        .result-fake .result-icon {
            color: #f44336;
        }

        .result-title {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .result-real .result-title {
            color: #2e7d32;
        }

        .result-fake .result-title {
            color: #c62828;
        }

        .confidence-score {
            font-size: 1.3em;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .result-description {
            color: #666;
            font-size: 1em;
            line-height: 1.5;
        }

        .new-analysis-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .new-analysis-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.3);
        }

        .error {
            background-color: #ffe8e8;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #f44336;
        }

        .hidden {
            display: none;
        }

        .file-info {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            text-align: left;
        }

        .file-info h4 {
            margin-bottom: 8px;
            color: #333;
        }

        .file-info p {
            margin: 4px 0;
            color: #666;
            font-size: 0.9em;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
            }
            
            .header {
                padding: 30px 20px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .content {
                padding: 30px 20px;
            }
            
            .upload-area {
                padding: 40px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Deepfake Detector</h1>
            <p>Advanced AI-powered deepfake detection technology</p>
        </div>

        <div class="content">
            <!-- Error Display -->
            <div id="errorDisplay" class="error hidden"></div>

            <!-- Upload Section -->
            <div id="uploadSection" class="upload-section">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📹</div>
                    <div class="upload-text">Drop your video here or click to browse</div>
                    <div class="upload-subtext">Supported formats: MP4, AVI, MOV (Max: 100MB)</div>
                </div>
                
                <input type="file" id="videoUpload" accept="video/*">
                
                <!-- File Info Display -->
                <div id="fileInfo" class="file-info hidden">
                    <h4>Selected File:</h4>
                    <p id="fileName"></p>
                    <p id="fileSize"></p>
                    <p id="fileType"></p>
                </div>
                
                <button id="uploadButton" class="upload-btn" disabled>Upload and Analyze</button>
            </div>

            <!-- Result Section -->
            <div id="resultSection" class="result-section hidden">
                <!-- Processing State -->
                <div id="processingState" class="processing-state">
                    <div class="spinner"></div>
                    <div class="processing-text">Analyzing your video...</div>
                    <div class="processing-detail">This may take a few moments</div>
                </div>

                <!-- Completed State -->
                <div id="completedState" class="completed-state hidden">
                    <div class="result-icon" id="resultIcon">✓</div>
                    <div class="result-title" id="resultTitle">Analysis Complete</div>
                    <div class="confidence-score" id="confidenceScore">Confidence: --</div>
                    <div class="result-description" id="resultDescription"></div>
                    
                    <button class="new-analysis-btn" onclick="startNewAnalysis()">Analyze Another Video</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // API Configuration
        const API_BASE_URL = 'http://127.0.0.1:8000';

        // DOM Elements
        const videoUpload = document.getElementById('videoUpload');
        const uploadArea = document.getElementById('uploadArea');
        const uploadButton = document.getElementById('uploadButton');
        const uploadSection = document.getElementById('uploadSection');
        const resultSection = document.getElementById('resultSection');
        const processingState = document.getElementById('processingState');
        const completedState = document.getElementById('completedState');
        const errorDisplay = document.getElementById('errorDisplay');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const fileType = document.getElementById('fileType');
        const resultIcon = document.getElementById('resultIcon');
        const resultTitle = document.getElementById('resultTitle');
        const confidenceScore = document.getElementById('confidenceScore');
        const resultDescription = document.getElementById('resultDescription');

        let selectedFile = null;

        // File Upload Handlers
        uploadArea.addEventListener('click', () => videoUpload.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFileSelection(files[0]);
            }
        });

        videoUpload.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileSelection(e.target.files[0]);
            }
        });

        uploadButton.addEventListener('click', handleUpload);

        function handleFileSelection(file) {
            // Validate file type
            if (!file.type.startsWith('video/')) {
                showError('Please select a video file.');
                return;
            }

            // Validate file size (100MB limit)
            const maxSize = 100 * 1024 * 1024; // 100MB
            if (file.size > maxSize) {
                showError('File size must be less than 100MB.');
                return;
            }

            selectedFile = file;
            displayFileInfo(file);
            uploadButton.disabled = false;
            hideError();
        }

        function displayFileInfo(file) {
            fileName.textContent = `Name: ${file.name}`;
            fileSize.textContent = `Size: ${formatFileSize(file.size)}`;
            fileType.textContent = `Type: ${file.type}`;
            fileInfo.classList.remove('hidden');
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        async function handleUpload() {
            if (!selectedFile) return;
            hideError();

            const formData = new FormData();
            formData.append('video_file', selectedFile);

            uploadSection.classList.add('hidden');
            resultSection.classList.remove('hidden');
            processingState.classList.remove('hidden');
            completedState.classList.add('hidden');

            uploadButton.disabled = true;
            uploadButton.textContent = 'Uploading...';

            try {
                // Step 1: Upload the video
                const uploadResponse = await fetch(`${API_BASE_URL}/upload-video`, {
                    method: 'POST',
                    body: formData,
                });

                if (!uploadResponse.ok) {
                    throw new Error(`Upload failed with status: ${uploadResponse.status}`);
                }

                const uploadResult = await uploadResponse.json();
                console.log('Upload response:', uploadResult);
                
                const { video_id } = uploadResult;
                if (!video_id) {
                    throw new Error('No video ID received from server');
                }

                // Step 2: Start polling for results
                startPolling(video_id);

            } catch (error) {
                console.error('Upload Error:', error);
                showError('Failed to upload the video. Please ensure the API server is running.');
                resetUI();
            }
        }

        function startPolling(videoId) {
            const pollInterval = setInterval(async () => {
                try {
                    const response = await fetch(`${API_BASE_URL}/detection-status/${videoId}`);
                    
                    if (!response.ok) {
                        throw new Error(`Status check failed: ${response.status}`);
                    }
                    
                    const result = await response.json();
                    console.log('Status response:', result);
                    
                    if (result.status === 'completed') {
                        clearInterval(pollInterval);
                        displayResults(result);
                    } else if (result.status === 'failed') {
                        clearInterval(pollInterval);
                        showError(`Detection failed: ${result.error || 'Unknown error'}`);
                        resetUI();
                    }
                    // Continue polling if status is 'processing'
                    
                } catch (error) {
                    console.error('Polling Error:', error);
                    clearInterval(pollInterval);
                    showError('Failed to check detection status. Please try again.');
                    resetUI();
                }
            }, 2000); // Poll every 2 seconds
        }

        function displayResults(result) {
            processingState.classList.add('hidden');
            completedState.classList.remove('hidden');

            const confidence = Math.round(result.confidence * 100);
            const isReal = result.result && result.result.toLowerCase().includes('real');

            if (isReal) {
                completedState.className = 'completed-state result-real';
                resultIcon.textContent = '✅';
                resultTitle.textContent = 'Authentic Video';
                resultDescription.textContent = 'Our AI analysis indicates this video appears to be genuine and has not been artificially manipulated.';
            } else {
                completedState.className = 'completed-state result-fake';
                resultIcon.textContent = '⚠️';
                resultTitle.textContent = 'Deepfake Detected';
                resultDescription.textContent = 'Our AI analysis has detected signs of artificial manipulation in this video. This video may be a deepfake.';
            }

            confidenceScore.textContent = `Confidence: ${confidence}%`;
        }

        function startNewAnalysis() {
            selectedFile = null;
            resetUI();
            uploadSection.classList.remove('hidden');
            resultSection.classList.add('hidden');
            fileInfo.classList.add('hidden');
            uploadButton.disabled = true;
            uploadButton.textContent = 'Upload and Analyze';
            videoUpload.value = '';
        }

        function resetUI() {
            uploadButton.disabled = false;
            uploadButton.textContent = 'Upload and Analyze';
        }

        function showError(message) {
            errorDisplay.textContent = message;
            errorDisplay.classList.remove('hidden');
        }

        function hideError() {
            errorDisplay.classList.add('hidden');
        }
    </script>
</body>
</html>
