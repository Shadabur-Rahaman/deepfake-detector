# fly.toml — Fly.io 1-click deploy
#
#   1. Install flyctl: https://fly.io/docs/hands-on/install-flyctl/
#   2. fly auth login
#   3. fly launch --no-deploy    (this file is auto-detected)
#   4. fly deploy
#
# The app boots as a single container on Fly's anycast network on
# https://<app-name>.fly.dev.  The shared-cpu-1x @ 512MB is enough for
# CPU-mode PyTorch inference on short videos.  Upgrade to performance-1x
# for production traffic.

app = "ifake-deepfake-detector"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = 60
swap_size_mb = 2048

[build]
  dockerfile = "Dockerfile"

[env]
  FORCE_CPU_MODE = "1"
  PYTHONUNBUFFERED = "1"
  PORT = "8000"
  DEVELOPMENT_MODE = "false"
  MAX_CONCURRENT_JOBS = "2"
  LOG_LEVEL = "info"
  CORS_ORIGINS = ""

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
  [[http_service.checks]]
    grace_period = "120s"
    interval = "30s"
    method = "GET"
    timeout = "10s"
    path = "/v1/health"

[[services]]
  internal_port = 8000
  protocol = "tcp"
  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
  [services.concurrency]
    type = "connections"
    hard_limit = 50
    soft_limit = 25

[[mounts]]
  source = "ifake_runtime"
  destination = "/app/runtime"
  processes = ["app"]
  initial_size = "10gb"
  volume_name = "ifake-runtime-vol"
